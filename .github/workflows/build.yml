name: Build binaries

on:
  push:
    branches:
      - main
      - agent/optimize-binary-size
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-build.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q
      - name: Run source self-test
        run: python main.py --self-test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: pdf-ocr-reviewer-linux-x86_64
            executable: dist/pdf-ocr-reviewer
            asset_name: pdf-ocr-reviewer-linux-x86_64
          - os: windows-2025
            artifact_name: pdf-ocr-reviewer-windows-x86_64
            executable: dist/pdf-ocr-reviewer.exe
            asset_name: pdf-ocr-reviewer-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Build one-file executable
        run: pyinstaller --noconfirm --clean pdf-ocr-reviewer.spec
      - name: Report executable size
        shell: python
        run: |
          from pathlib import Path
          executable = Path(r"${{ matrix.executable }}")
          print(f"EXECUTABLE_SIZE_BYTES={executable.stat().st_size}")
      - name: Run packaged self-test
        run: ${{ matrix.executable }} --self-test
      - name: Rename release asset
        shell: python
        run: |
          from pathlib import Path
          source = Path(r"${{ matrix.executable }}")
          destination = Path("dist") / "${{ matrix.asset_name }}"
          if destination.exists():
              destination.unlink()
          source.rename(destination)
      - name: Upload binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v'))
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: pdf-ocr-reviewer-*
          path: release-dist
          merge-multiple: true
      - name: Create SHA-256 checksums
        working-directory: release-dist
        run: sha256sum pdf-ocr-reviewer-* > SHA256SUMS.txt
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            verify_tag=true
          else
            tag="$(printf '%s\n' "${COMMIT_MESSAGE}" | sed -n '1s/^Release \(v[0-9][0-9A-Za-z.-]*\).*$/\1/p')"
            verify_tag=false
          fi
          if [[ -z "${tag}" ]]; then
            echo "Could not resolve release tag." >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "verify_tag=${verify_tag}" >> "${GITHUB_OUTPUT}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERIFY_TAG: ${{ steps.release.outputs.verify_tag }}
        run: |
          if [[ "${VERIFY_TAG}" == "true" ]]; then
            gh release create "${RELEASE_TAG}" release-dist/* --generate-notes --verify-tag
          else
            gh release create "${RELEASE_TAG}" release-dist/* --generate-notes --target "${GITHUB_SHA}"
          fi
