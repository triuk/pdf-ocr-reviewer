<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF OCR Reviewer</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="index.css">
  <script src="webui.js"></script>
  <script src="state.js" defer></script>
  <script src="files.js" defer></script>
  <script src="document.js" defer></script>
  <script src="pages.js" defer></script>
  <script src="issues.js" defer></script>
  <script src="workflow.js" defer></script>
</head>
<body>
  <header class="toolbar">
    <button id="selectFolderId" type="button">Open folder</button>
    <input id="folderPathId" type="text" spellcheck="false" placeholder="Path to folder with PDFs">
    <button id="openPathId" type="button" class="secondary">Load path</button>
    <button id="refreshFolderId" type="button" class="secondary" title="Znovu načíst manifest i PDF po externí opravě">Načíst opravy</button>
    <button id="exportCsvId" type="button" class="secondary">Export CSV</button>
    <span id="saveStateId" class="save-state">Manifest not open</span>

    <label class="toolbar-field">
      <span>OCR</span>
      <select id="ocrModeId">
        <option value="layout">Layout</option>
        <option value="pdf_order" selected>PDF order</option>
        <option value="geometric_order">Geometric order</option>
      </select>
    </label>

    <label class="switch-field">
      <span>Overlay</span>
      <span class="switch">
        <input id="overlayId" type="checkbox" checked>
        <span class="switch-track"></span>
      </span>
    </label>

    <label class="zoom-field">
      <span>Zoom</span>
      <input id="zoomId" type="range" min="50" max="200" step="10" value="100">
      <output id="zoomValueId">100 %</output>
    </label>
  </header>

  <main class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-tools">
        <input id="nameFilterId" type="search" placeholder="Filter names">
        <select id="statusFilterId">
          <option value="all">All statuses</option>
          <option value="unreviewed">Unreviewed</option>
          <option value="ok">OK</option>
          <option value="error">OCR error</option>
          <option value="needs_review">Needs review</option>
        </select>
      </div>
      <div id="fileSummaryId" class="file-summary">No folder is open.</div>
      <div id="fileListId" class="file-list" role="listbox" aria-label="PDF files"></div>
      <section id="issueSidebarId" class="issue-sidebar" aria-label="Připomínky dokumentu" hidden>
        <div class="issue-list-heading"><strong>Připomínky</strong>
          <select id="issueFilterId" aria-label="Filtrovat připomínky">
            <option value="active">Otevřené a k ověření</option>
            <option value="fixed">K ověření</option>
            <option value="open">Otevřené</option>
            <option value="all">Všechny</option>
            <option value="dismissed">Zrušené</option>
          </select>
        </div>
        <div id="issueSummaryId" class="issue-summary"></div>
        <div id="issueListId" class="issue-list"></div>
      </section>
    </aside>

    <section class="workspace">
      <div class="document-toolbar">
        <div>
          <strong id="documentNameId">Select a PDF</strong>
          <span id="documentMetaId"></span>
        </div>
        <div class="status-buttons" aria-label="Review status">
          <button type="button" data-status="unreviewed" class="status-button">0 Unreviewed</button>
          <button type="button" data-status="ok" class="status-button status-ok">1 OK</button>
          <button type="button" data-status="error" class="status-button status-error">2 Error</button>
          <button type="button" data-status="needs_review" class="status-button status-review">3 Review</button>
        </div>
      </div>

      <div class="issue-toolbar" aria-label="Označování OCR">
        <button id="markIssueId" type="button" class="secondary" aria-pressed="false" title="M — zapnout/vypnout označování">Označovat · M</button>
        <select id="issueKindId" aria-label="Typ nové připomínky" title="Použije se pro další označení">
          <option value="position">Špatná poloha</option>
          <option value="oversized">Špatná velikost boxu</option>
          <option value="text">Chybný text</option>
          <option value="missing">Chybějící text</option>
          <option value="other">Jiný problém</option>
        </select>
        <button id="previousIssueId" class="secondary" type="button" title="K — předchozí připomínka">← K</button>
        <button id="nextIssueId" class="secondary" type="button" title="J — další připomínka">Další · J →</button>
        <span id="markHintId" class="mark-hint">M: označit slovo kliknutím nebo oblast tažením. Esc: čtení.</span>
      </div>

      <div class="column-headings" aria-hidden="true">
        <span>Scan</span>
        <span>OCR layer</span>
      </div>

      <div id="pageScrollId" class="page-scroll">
        <div id="emptyStateId" class="empty-state">
          Open a folder with PDFs and select a file on the left.
        </div>
        <div id="pagesId" class="pages"></div>
      </div>

      <div class="note-panel">
        <div class="file-note"><label for="fileNoteId">File note</label>
          <textarea id="fileNoteId" rows="2" placeholder="The note is saved to the manifest."></textarea>
        </div>
        <section id="issueEditorId" class="issue-editor" aria-label="Vybraná připomínka" hidden>
          <div class="issue-editor-heading"><strong id="selectedIssueTitleId"></strong>
            <span id="issueSaveId" role="status"></span>
            <button id="closeIssueId" type="button" class="secondary" title="Zavřít detail">×</button>
          </div>
          <div class="issue-editor-fields">
            <select id="selectedIssueKindId" aria-label="Typ vybrané připomínky"></select>
            <textarea id="issueNoteId" rows="2" placeholder="Volitelná poznámka · ukládá se automaticky" aria-label="Poznámka k místu"></textarea>
          </div>
          <div id="issueResultId" class="issue-result"></div>
          <div class="issue-actions">
            <button id="verifyIssueId" type="button" title="C — potvrdit a přejít na další">Potvrdit a další · C</button>
            <button id="reopenIssueId" type="button" class="secondary" title="R — znovu otevřít připomínku">Vrátit k opravě · R</button>
            <button id="dismissIssueId" type="button" class="secondary">Zrušit označení</button>
            <button id="retryIssueSaveId" type="button" class="secondary" hidden>Uložit poznámku</button>
          </div>
        </section>
      </div>
    </section>
  </main>

  <div id="toastId" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
